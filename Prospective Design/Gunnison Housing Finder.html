<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valley Housing Fund — Find a Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f4f7f6;
  --surface:#ffffff;
  --surface-2:#eef4f1;
  --ink:#083840;
  --ink-2:#3c585e;
  --muted:#7d9499;
  --line:#dde7e3;
  --line-strong:#c4d5cf;
  --accent:#189090;
  --accent-deep:#0f6f70;
  --lime:#c0d030;
  --lime-deep:#6c8312;
  --warm:#c0d030;
  --warm-soft:#eef4d3;
  --good:#2f7d62;
  --serif:"Montserrat",system-ui,sans-serif;
  --sans:"Open Sans",system-ui,sans-serif;
  --mono:"Montserrat",system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root{min-height:100vh;}
.app{
  max-width:1180px;
  margin:0 auto;
  padding:0 clamp(20px,5vw,56px);
}

/* ── Masthead ───────────────────────────────────────────── */
.masthead{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;
  padding:22px 0 20px;
  border-bottom:1px solid var(--line);
}
.mast-left{display:flex;align-items:center;gap:14px;}
.mast-mark{
  width:34px;height:34px;border:1.5px solid var(--ink);
  border-radius:7px;position:relative;flex:none;
  display:grid;place-items:center;overflow:hidden;
}
.mast-peak{
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:13px solid var(--ink);
  margin-bottom:-1px;
}
.mast-id{line-height:1.25;}
.mast-org{font-weight:600;font-size:13.5px;letter-spacing:.01em;white-space:nowrap;}
.mast-id{min-width:0;}
.mast-sub{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.13em;margin-top:2px;
}
.mast-right{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.13em;text-align:right;
  white-space:nowrap;flex:none;
}

/* ── Brand lockup ───────────────────────────────────────── */
.brand{
  display:flex;align-items:center;gap:13px;
  padding:26px 0 0;
}
.brand-mark{
  width:46px;height:46px;border-radius:11px;flex:none;
  background:var(--lime);display:grid;place-items:center;position:relative;
}
.brand-house{
  width:23px;height:21px;background:var(--accent);
  clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%);
  position:relative;
}
.brand-house::after{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:6px;height:8px;background:var(--lime);border-radius:1px;
}
.brand-wordmark{
  font-family:var(--serif);font-weight:800;font-size:15px;line-height:1.05;
  letter-spacing:.02em;color:var(--ink);text-transform:uppercase;
}
.brand-kicker{
  font-family:var(--sans);font-weight:600;font-size:11px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.14em;margin-top:3px;
}

/* ── Hero ───────────────────────────────────────────────── */
.hero{
  padding:clamp(34px,5vw,52px) 0 clamp(28px,4vw,44px);
  max-width:780px;
}
.hero-eyebrow{
  font-family:var(--sans);font-weight:700;font-size:13px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.13em;margin:0 0 14px;
}
.hero-title{
  font-family:var(--serif);
  font-weight:800;
  font-size:clamp(33px,5.2vw,56px);
  line-height:1.05;
  letter-spacing:-0.02em;
  margin:0 0 8px;
  text-wrap:balance;
  color:var(--ink);
}
.hero-title .accentword{color:var(--accent);}
.hero-rule{width:64px;height:5px;background:var(--lime);border-radius:3px;margin:18px 0 20px;}
.hero-lede{
  font-size:clamp(16px,1.7vw,19px);
  line-height:1.55;
  color:var(--ink-2);
  margin:0;
  max-width:60ch;
  text-wrap:pretty;
}

/* ── Layout ─────────────────────────────────────────────── */
.layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:clamp(24px,3vw,48px);
  align-items:start;
  padding-bottom:64px;
}
.col-form{position:sticky;top:24px;}
@media(max-width:880px){
  .layout{grid-template-columns:1fr;}
  .col-form{position:static;}
}

/* ── Panels ─────────────────────────────────────────────── */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.16em;color:var(--accent);
}

/* ── Form ───────────────────────────────────────────────── */
.form-panel{padding:26px 26px 24px;}
.panel-head{margin-bottom:22px;}
.panel-title{
  font-family:var(--serif);font-weight:700;font-size:22px;
  line-height:1.15;margin:8px 0 0;letter-spacing:-.01em;
}
.field{margin-bottom:20px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field-row .field{margin-bottom:20px;}
.field-label{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;margin-bottom:9px;
}
.field-label>span:first-child{
  font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.005em;
  flex:1 1 auto;
}
.field-hint{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  text-transform:lowercase;letter-spacing:.04em;text-align:right;
  flex:0 0 auto;white-space:nowrap;
}

/* Segmented control */
.seg{
  display:flex;gap:4px;padding:4px;
  background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;
}
.seg-btn{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2);
  padding:8px 10px;border-radius:5px;transition:all .15s ease;
  letter-spacing:.01em;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.is-active{
  background:var(--ink);color:var(--surface);
  box-shadow:0 1px 2px rgba(31,42,45,.18);
}

/* Money input */
.money-wrap{
  display:flex;align-items:center;gap:8px;
  border-bottom:1.5px solid var(--line-strong);
  padding:6px 2px 8px;transition:border-color .15s ease;
}
.money-wrap:focus-within{border-color:var(--accent);}
.money-prefix{font-family:var(--serif);font-weight:700;font-size:21px;color:var(--ink-2);line-height:1;}
.input-money{
  flex:1;border:0;background:transparent;outline:0;
  font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);
  padding:0;min-width:0;letter-spacing:-.01em;
}
.input-money::placeholder{color:var(--line-strong);}
.money-suffix{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
}

/* Stepper */
.stepper{
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);padding:4px;
}
.step-btn{
  width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
  border-radius:6px;cursor:pointer;font-size:20px;color:var(--ink);
  display:grid;place-items:center;transition:all .15s ease;line-height:1;
}
.step-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.step-btn:disabled{opacity:.35;cursor:default;}
.step-value{
  display:flex;align-items:baseline;gap:7px;
  font-family:var(--serif);font-size:21px;font-weight:700;
}
.step-unit{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

/* Primary button */
.btn-primary{
  width:100%;appearance:none;border:0;cursor:pointer;
  background:var(--accent);color:#ffffff;
  font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.01em;
  padding:15px 20px;border-radius:8px;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .15s ease,transform .05s ease;
}
.btn-primary:hover{background:var(--accent-deep);}
.btn-primary:active{transform:translateY(1px);}
.btn-arrow{font-size:17px;transition:transform .2s ease;}
.btn-primary:hover .btn-arrow{transform:translateX(3px);}
.btn-compact{width:auto;padding:12px 22px;margin-top:18px;}
.form-foot{
  font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--muted);
  margin:16px 0 0;letter-spacing:.02em;
}

/* ── Eligibility summary ────────────────────────────────── */
.summary{padding:26px 28px 24px;margin-bottom:28px;}
.summary-empty{background:var(--surface-2);}
.summary-prompt{
  font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--ink-2);
  margin:14px 0 0;max-width:46ch;
}
.summary-grid{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
}
.summary-big{display:flex;align-items:baseline;gap:12px;margin:12px 0 8px;flex-wrap:wrap;}
.summary-pct{
  font-family:var(--serif);font-weight:800;font-size:clamp(44px,6vw,60px);
  line-height:.9;letter-spacing:-.03em;color:var(--accent);
}
.summary-of{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink-2);}
.summary-sub{
  font-size:13px;color:var(--muted);line-height:1.5;
}
.summary-dot{margin:0 8px;color:var(--line-strong);}
.summary-pill-wrap{flex:none;}
.summary-pill{
  display:flex;flex-direction:column;gap:3px;
  border:1px solid var(--warm);background:var(--warm-soft);
  border-radius:8px;padding:11px 16px;text-align:right;
}
.summary-pill-k{font-family:var(--mono);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--lime-deep);}
.summary-pill-v{font-family:var(--serif);font-size:24px;font-weight:800;color:var(--ink);line-height:1;}

/* AMI meter */
.meter{margin:26px 0 18px;}
.meter-track{
  position:relative;height:6px;border-radius:4px;
  background:var(--surface-2);border:1px solid var(--line);
  margin:36px 0 30px;
}
.meter-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:var(--accent);border-radius:4px 0 0 4px;opacity:.9;
}
.meter-tick{position:absolute;top:-9px;bottom:-9px;width:1px;background:var(--line-strong);}
.meter-tick-label{
  position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--muted);
}
.meter-marker{position:absolute;top:50%;width:0;}
.meter-marker::after{
  content:"";position:absolute;left:-7px;top:-7px;
  width:14px;height:14px;border-radius:50%;
  background:var(--ink);border:2.5px solid var(--surface);
  box-shadow:0 0 0 1px var(--ink);
}
.meter-marker-flag{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  white-space:nowrap;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);
  background:var(--warm-soft);border:1px solid var(--warm);
  padding:2px 7px;border-radius:5px;
}
.meter-axis{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);
}

/* note line */
.summary-note{
  display:flex;align-items:flex-start;gap:10px;
  font-size:13.5px;line-height:1.5;color:var(--ink-2);
  padding-top:18px;border-top:1px solid var(--line);
}
.note-dot{
  width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;
}
.summary-note.is-good .note-dot{background:var(--good);}
.summary-note.is-warn .note-dot{background:var(--warm);}

/* ── Results ────────────────────────────────────────────── */
.results-head{margin-bottom:18px;}
.results-title{
  font-family:var(--serif);font-weight:800;font-size:clamp(22px,2.4vw,27px);
  line-height:1.2;margin:8px 0 0;letter-spacing:-.02em;
}
.listing-list{display:flex;flex-direction:column;gap:16px;}

/* Listing card */
.listing{
  display:grid;grid-template-columns:148px minmax(0,1fr);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.listing:hover{
  border-color:var(--line-strong);
  box-shadow:0 6px 22px -14px rgba(31,42,45,.4);
}
.listing-figure{
  position:relative;
  background:
    repeating-linear-gradient(135deg,#d6e4df 0 1px,transparent 1px 11px),
    var(--surface-2);
  border-right:1px solid var(--line);
  display:flex;align-items:flex-end;padding:12px;min-height:170px;
}
.listing-figure-label{
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);
}
.listing-index{
  position:absolute;top:12px;left:12px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2);
  border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;
  background:var(--surface);
}
.listing-body{padding:18px 20px 16px;display:flex;flex-direction:column;}
.listing-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.listing-top>div:first-child{min-width:0;}
.listing-address{
  font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.18;
  margin:0;letter-spacing:-.01em;
}
.listing-town{font-size:12.5px;color:var(--muted);margin-top:3px;}
.listing-price{
  font-family:var(--serif);font-weight:800;font-size:21px;color:var(--accent);
  white-space:nowrap;letter-spacing:-.01em;
}
.listing-specs{
  display:flex;align-items:center;flex-wrap:wrap;gap:7px 10px;margin:12px 0;
  font-size:12.5px;color:var(--ink-2);font-weight:500;
}
.listing-specs>span{white-space:nowrap;}
.spec-sep{width:3px;height:3px;border-radius:50%;background:var(--line-strong);}
.listing-blurb{font-size:14px;line-height:1.5;color:var(--ink-2);margin:0 0 14px;text-wrap:pretty;}
.listing-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.cap-badge{
  font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap;
  color:var(--accent-deep);background:#e1efec;
  border:1px solid #bcdbd4;border-radius:5px;padding:3px 8px;letter-spacing:.02em;
}
.tag{
  font-size:11.5px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;
  border:1px solid var(--line);border-radius:5px;padding:3px 8px;
}
.listing-foot{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
}
.listing-contact{display:flex;flex-direction:column;gap:1px;}
.contact-name{font-size:12.5px;font-weight:600;color:var(--ink);}
.contact-phone{font-family:var(--mono);font-size:11px;color:var(--muted);}
.btn-ghost{
  appearance:none;cursor:pointer;white-space:nowrap;
  background:transparent;border:1px solid var(--line-strong);
  color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:600;
  padding:9px 16px;border-radius:7px;transition:all .15s ease;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-2);}

@media(max-width:520px){
  .listing{grid-template-columns:1fr;}
  .listing-figure{min-height:96px;border-right:0;border-bottom:1px solid var(--line);}
}

/* Empty state */
.empty-state{padding:30px 28px;}
.empty-lead{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.3;margin:0 0 10px;}
.empty-sub{font-size:14px;line-height:1.55;color:var(--ink-2);margin:0;max-width:52ch;}

/* hidden note */
.hidden-note{
  display:flex;align-items:flex-start;gap:12px;margin-top:22px;
  padding:16px 18px;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:8px;
  font-size:13px;line-height:1.5;color:var(--ink-2);
}
.hidden-count{
  font-family:var(--serif);font-weight:800;font-size:18px;color:var(--accent);
  flex:none;line-height:1.1;
}

/* ── Colophon ───────────────────────────────────────────── */
.colophon{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:24px 0 40px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;line-height:1.5;
}
.colophon span:first-child{max-width:70ch;text-transform:none;letter-spacing:.02em;font-size:11px;}
.colophon-mark{flex:none;border:1px solid var(--line-strong);border-radius:5px;padding:4px 9px;}

.brand-id{line-height:1.12;}
.page-disclaimer{
  max-width:80ch;margin:8px 0 0;padding:18px 0 40px;
  border-top:1px solid var(--line);
  font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--muted);
}

/* Tweak: hide listing photo panel */
body.no-figure .listing{grid-template-columns:1fr;}
body.no-figure .listing-figure{display:none;}

@media(max-width:560px){
  .field-row{grid-template-columns:1fr;}
  .summary-grid{flex-direction:column;}
  .summary-pill{align-self:flex-start;text-align:left;}
  .colophon{flex-direction:column;align-items:flex-start;gap:12px;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
