<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gunnison County Housing Calculator – Embed Test</title>
  <style>
    body { margin: 0; padding: 1rem; font-family: sans-serif; background: #f5f5f5; }
    h1 { font-size: 1rem; color: #555; margin-bottom: 0.5rem; }
    iframe { display: block; border: none; width: 100%; max-width: 700px; }
  </style>
</head>
<body>
  <h1>Embed preview — Gunnison County Housing Calculator</h1>

  <!--
    EMBED SNIPPET
    Copy the <iframe> tag below and paste it into any web page.
    Replace the src URL with the live Vercel deployment URL once deployed.

    Recommended attributes:
      src    — your Vercel deployment URL (e.g. https://your-app.vercel.app)
      width  — "100%" scales to the parent container; set a max-width in CSS
      height — 800px fits the form + a short results list; adjust as needed
  -->
  <iframe
    src="https://gunnison-county-housing-calculator.vercel.app"
    width="100%"
    height="800"
    title="Gunnison County Affordable Housing Calculator"
    loading="lazy"
  ></iframe>

  <p style="margin-top:0.5rem;font-size:0.8rem;color:#888;">
    Replace <code>src</code> with the deployed Vercel URL before sharing.
  </p>
</body>
</html>
